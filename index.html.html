<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b3fe4">
<title>Pokemoji Blitz 3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff}
body{background:linear-gradient(160deg,#ff7eb3 0%,#a35cff 45%,#3fb5ff 100%);}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,#fff5 0 6%,transparent 7%),radial-gradient(circle at 80% 30%,#fff4 0 4%,transparent 5%),radial-gradient(circle at 60% 85%,#fff3 0 8%,transparent 9%),radial-gradient(circle at 10% 70%,#fff3 0 3%,transparent 4%);pointer-events:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:hidden}
.screen.on{display:flex}
.scroll{overflow-y:auto;touch-action:pan-y;width:100%;-webkit-overflow-scrolling:touch}
h1.logo{font-size:clamp(40px,13vw,68px);line-height:.95;margin:4px 0 6px;text-align:center;font-weight:900;letter-spacing:1px;color:#ffe14d;text-shadow:0 4px 0 #ff5fa2,0 8px 0 #7a2bd6,0 12px 18px #0006;transform:rotate(-3deg);animation:bob 2.4s ease-in-out infinite}
h1.logo span{display:block;color:#fff;font-size:.62em}
h1.logo b{color:#5ef0ff;font-size:1.25em}
@keyframes bob{50%{transform:rotate(-3deg) translateY(-6px) scale(1.02)}}
.btn{border:0;border-radius:22px;padding:14px 26px;font-weight:900;font-size:20px;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 6px 0 #c76a00,0 10px 16px #0004;text-shadow:0 2px 0 #0003;margin:6px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c76a00}
.btn.pink{background:linear-gradient(#ff8ac4,#ff4f9a);box-shadow:0 6px 0 #b8216a,0 10px 16px #0004}
.btn.blue{background:linear-gradient(#6fe3ff,#2e9bff);box-shadow:0 6px 0 #1560b8,0 10px 16px #0004}
.btn.green{background:linear-gradient(#8dff8a,#25c46b);box-shadow:0 6px 0 #138046,0 10px 16px #0004}
.btn.small{font-size:15px;padding:9px 16px;border-radius:16px}
.btn.big{font-size:28px;padding:16px 46px;border-radius:30px}
.card{background:#ffffff26;border:3px solid #ffffff70;border-radius:24px;padding:12px;backdrop-filter:blur(6px);box-shadow:0 8px 20px #0003}
.credits{text-align:center;font-weight:800;font-size:16px;line-height:1.5;text-shadow:0 2px 0 #0004}
.credits a{color:#fff36b;text-decoration:underline}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.menuInfo{display:flex;gap:10px;margin:8px 0;width:100%;max-width:420px}
.menuInfo .card{flex:1;text-align:center;font-weight:800;padding:8px}
.menuInfo .big{font-size:24px;color:#ffe14d}
.sil{width:64px;height:64px;filter:brightness(0) drop-shadow(0 0 4px #fff);}
.lbl{font-size:12px;opacity:.9;text-transform:uppercase;letter-spacing:1px}
/* Loading */
#loading{justify-content:center}
.bar{width:70%;max-width:300px;height:18px;border-radius:12px;background:#0003;overflow:hidden;border:3px solid #fff}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4f9a,#ffd23f,#5ef0ff,#8dff8a);transition:width .2s}
/* hero select */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;width:100%}
.hcard{background:#fff3;border:3px solid #fff6;border-radius:18px;padding:4px;text-align:center;font-size:11px;font-weight:800;cursor:pointer;position:relative}
.hcard.sel{border-color:#ffe14d;background:#fff6;box-shadow:0 0 0 3px #ff9f1c,0 0 18px #ffe14d}
.hcard .gen{position:absolute;top:2px;right:6px;font-size:10px;opacity:.85}
.face{width:60px;height:60px;border-radius:50%;margin:0 auto;position:relative;background:radial-gradient(circle at 34% 28%,#fffc 0 9%,#fff0 32%),radial-gradient(circle at 50% 120%,#0003,#0000 60%),var(--c,#ffb3d9);border:3px solid #fff;box-shadow:inset 0 -4px 0 #0002,0 3px 0 #0003;overflow:hidden}
.face img{position:absolute;left:8%;top:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 1px #0005)}
.heroInfo{width:100%;max-width:480px;display:flex;gap:12px;align-items:center;margin:6px 0}
.heroInfo .face{width:84px;height:84px;flex:none}
.heroInfo h3{margin:0;font-size:22px;color:#ffe14d;text-shadow:0 2px 0 #0004}
.heroInfo p{margin:2px 0;font-size:14px;font-weight:700}
/* game */
#game{padding-top:max(8px,env(safe-area-inset-top))}
.hud{width:100%;max-width:560px;display:flex;gap:6px;align-items:stretch}
.hud .card{padding:5px 8px;border-radius:16px;text-align:center;font-weight:900}
#hTime{font-size:30px;min-width:76px;color:#fff;background:linear-gradient(#ff7aa8,#ff3d7f);border-color:#fff}
#hTime.low{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1);background:#ff1f4f}}
.scoreBox{flex:1;display:flex;flex-direction:column;justify-content:center}
#hScore{font-size:24px;color:#ffe14d;text-shadow:0 2px 0 #0005}
.prog{height:10px;border-radius:6px;background:#0003;overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8dff8a,#ffe14d);transition:width .3s}
.nextBox{width:66px;display:flex;flex-direction:column;align-items:center;font-size:9px}
.nextBox img{width:40px;height:40px;filter:brightness(0) drop-shadow(0 0 3px #fff)}
#boardWrap{position:relative;margin:8px 0;border-radius:22px;padding:6px;background:linear-gradient(#ffffff55,#ffffff22);border:4px solid #fff;box-shadow:0 10px 30px #0004,inset 0 0 20px #fff5}
#board{position:relative;touch-action:none;border-radius:16px;background:repeating-conic-gradient(#ffffff18 0 25%,#0000 0 50%) 0 0/calc(var(--s)*2) calc(var(--s)*2);overflow:hidden}
.tile{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .22s cubic-bezier(.34,1.35,.64,1);will-change:transform;pointer-events:none}
.tile.noanim{transition:none}
.tile .face{width:90%;height:90%;margin:5%;border-width:2px;transition:transform .15s}
.tile.sel .face{transform:scale(1.15);box-shadow:0 0 0 4px #ffe14d,0 0 16px #fff}
.tile.hint .face{animation:hint .6s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.18) rotate(8deg)}}
.tile.pop .face{animation:pop .22s ease-in forwards}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}
.tile.born .face{animation:born .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes born{0%{transform:scale(0)}}
.badge{position:absolute;font-size:calc(var(--s)*.42);right:-2%;bottom:-4%;filter:drop-shadow(0 2px 2px #0007);pointer-events:none}
.pu-L .face{box-shadow:0 0 0 3px #7fe7ff,0 0 14px #3fd0ff;animation:glowL 1s infinite alternate}
@keyframes glowL{to{box-shadow:0 0 0 3px #fff,0 0 22px #3fd0ff}}
.pu-S .face{box-shadow:0 0 0 3px #ffe14d,0 0 18px #ffb700}
.pu-S .rays{position:absolute;inset:-12%;border-radius:50%;background:repeating-conic-gradient(#ffe14daa 0 12deg,#0000 12deg 30deg);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pu-R .face{background:conic-gradient(#ff4f9a,#ffd23f,#8dff8a,#5ef0ff,#a35cff,#ff4f9a);animation:spin 2s linear infinite}
.pu-R .face img{display:none}
.pu-R .star{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.6);filter:drop-shadow(0 0 6px #fff)}
.pu-item .face{background:linear-gradient(#ff3b3b 0 46%,#222 46% 54%,#fff 54%);border-color:#222}
.pu-item .face:after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:#fff;border:3px solid #222}
.pu-item .face img{display:none}
.fx{position:absolute;pointer-events:none;z-index:5}
.beamH{left:0;right:0;height:calc(var(--s)*.8);background:linear-gradient(#fff0,#bff6ff,#fff,#bff6ff,#fff0);box-shadow:0 0 20px #5ef0ff;animation:beam .4s ease-out forwards}
.beamV{top:0;bottom:0;width:calc(var(--s)*.8);background:linear-gradient(90deg,#fff0,#bff6ff,#fff,#bff6ff,#fff0);box-shadow:0 0 20px #5ef0ff;animation:beam .4s ease-out forwards}
.sun.beamH,.sun.beamV{filter:hue-rotate(-150deg) saturate(3)}
@keyframes beam{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1)}100%{opacity:0}}
.rainbowSweep{inset:0;background:linear-gradient(120deg,#ff4f9a88,#ffd23f88,#8dff8a88,#5ef0ff88,#a35cff88);animation:sweep .6s ease-out forwards}
@keyframes sweep{0%{clip-path:inset(0 100% 0 0)}60%{clip-path:inset(0 0 0 0);opacity:1}100%{opacity:0}}
.part{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:6;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.spop{position:absolute;z-index:7;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #a35cff,0 0 6px #000a;pointer-events:none;animation:rise .8s ease-out forwards}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
#combo{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:44px;font-weight:900;color:#ffe14d;text-shadow:0 4px 0 #ff4f9a,0 8px 10px #0007;pointer-events:none;z-index:9;opacity:0}
#combo.show{animation:comboA .9s ease-out}
@keyframes comboA{0%{opacity:0;transform:scale(.3) rotate(-10deg)}25%{opacity:1;transform:scale(1.2) rotate(3deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.bottom{width:100%;max-width:560px;display:flex;gap:10px;align-items:center}
#heroBtn{position:relative;width:84px;height:84px;flex:none;border-radius:50%;padding:6px;background:conic-gradient(#ffe14d var(--m,0%),#ffffff44 0);border:0;cursor:pointer;box-shadow:0 4px 10px #0004}
#heroBtn .face{width:72px;height:72px}
#heroBtn.full{animation:heroGlow .6s infinite alternate}
@keyframes heroGlow{to{box-shadow:0 0 0 4px #fff,0 0 30px #ffe14d;transform:scale(1.07)}}
#heroBtn .tap{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#ff4f9a;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:900;display:none}
#heroBtn.full .tap{display:block}
.blitzCol{flex:1;display:flex;flex-direction:column;gap:4px}
.blitzBar{height:26px;border-radius:14px;background:#0004;border:3px solid #fff;overflow:hidden;position:relative}
.blitzBar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff4f9a,#ff9f1c,#ffe14d,#8dff8a,#5ef0ff,#a35cff);transition:width .25s}
.blitzBar span{position:absolute;inset:0;text-align:center;font-weight:900;font-size:14px;line-height:20px;text-shadow:0 1px 2px #000}
body.blitz .blitzBar i{animation:rb .4s linear infinite;background-size:200% 100%}
@keyframes rb{to{background-position:200% 0}}
body.blitz #boardWrap{box-shadow:0 0 0 4px #ffe14d,0 0 40px #ff4f9a,0 0 80px #5ef0ff;animation:bw 1s linear infinite}
@keyframes bw{50%{box-shadow:0 0 0 4px #5ef0ff,0 0 40px #8dff8a,0 0 80px #ff4f9a}}
.gameBtns{display:flex;gap:6px;justify-content:space-between;font-size:13px;font-weight:800}
.iconBtn{border:0;background:#fff3;color:#fff;border-radius:12px;padding:5px 10px;font-weight:900;font-family:inherit;cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:#2a0b4dcc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center;background:linear-gradient(#b46bff,#7b3fe4);max-height:92vh;overflow-y:auto;touch-action:pan-y}
.stars{font-size:46px;letter-spacing:6px}
.stars .off{filter:grayscale(1) brightness(.5)}
.reveal .face{width:110px;height:110px;animation:reveal 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes reveal{0%{transform:scale(0) rotate(-180deg)}}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:440px}
.lv{border:0;border-radius:14px;padding:8px 0;font-weight:900;font-size:17px;font-family:inherit;color:#fff;background:linear-gradient(#6fe3ff,#2e9bff);box-shadow:0 4px 0 #1560b8;cursor:pointer}
.lv small{display:block;font-size:10px;color:#ffe14d}
.lv.lock{background:#fff3;box-shadow:none;opacity:.6}
.lv.cur{background:linear-gradient(#ffd23f,#ff9f1c);box-shadow:0 4px 0 #c76a00}
.topbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.topbar h2{margin:0;font-size:24px;text-shadow:0 3px 0 #0004}
#banner{position:fixed;left:0;right:0;top:35%;text-align:center;z-index:40;pointer-events:none;font-size:46px;font-weight:900;color:#fff;text-shadow:0 4px 0 #ff4f9a,0 8px 0 #7a2bd6;display:none}
#banner.on{display:block;animation:comboA 1.4s ease-out forwards}
</style></head>

<div id="loading" class="screen on"><h1 class="logo">Pokemoji<span>Blitz <b>3</b></span></h1><p style="font-weight:900">Loading Pokemoji Blitz 3…</p><div class="bar"><i id="loadBar"></i></div></div>

<div id="menu" class="screen">
 <div class="scroll" style="display:flex;flex-direction:column;align-items:center;height:100%">

 <div class="row" id="menuFaces" style="margin:6px 0 4px"></div>
 <div class="credits card" style="margin:8px 0">Created by <b>@JeremeGore</b><br><a href="http://digitalexplorationgrowth.com/" target="_blank" rel="noopener">DigitalExplorationGrowth.com</a></div>
 <div class="menuInfo">

  <div class="card"><div class="lbl">Next Pokémon</div><img class="sil" id="mNextImg" alt=""><div id="mNextName" style="font-size:12px"></div></div>
 </div>
 <button class="btn big" id="bPlay">▶ PLAY</button>
 <div class="row"><button class="btn blue" id="bLevels">Levels</button><button class="btn pink" id="bCollection">Pokémon <span id="mCount"></span></button></div>
 <div class="row"><button class="btn green small" id="bCredits">Credits</button><button class="btn small blue" id="bSettings">⚙ Settings</button><button class="btn small pink" id="bHow">How to Play</button></div>
 </div>
</div>

<div id="heroSel" class="screen">
 <div class="topbar"><button class="iconBtn" id="hsBack">◀ Back</button><h2>Pick your Hero</h2><span id="hsLevel" style="font-weight:900">Lv 1</span></div>

 <div class="scroll" style="flex:1"><div class="grid" id="heroGrid"></div></div>
 <div style="font-weight:800;font-size:14px;margin:4px">Target: <span id="hsTarget" style="color:#ffe14d"></span></div>
 <button class="btn big green" id="bStart">GO!</button>
</div>

<div id="game" class="screen">
 <div class="hud">
  <div class="card" style="display:flex;flex-direction:column;justify-content:center;min-width:54px"><div class="lbl">Lv</div><div id="hLevel" style="font-size:22px">1</div></div>
  <div class="card scoreBox"><div id="hScore">0</div><div class="prog"><i id="hProg"></i></div><div style="font-size:11px">Target <span id="hTarget"></span></div></div>

  <div class="card nextBox"><div class="lbl" style="font-size:8px">Next</div><img id="hNext" alt=""></div>
 </div>
 <div id="boardWrap"><div id="board"></div><div id="combo"></div></div>
 <div class="bottom">
  <button id="heroBtn"><div class="face" id="heroFace"><img alt=""></div><div class="tap">TAP!</div></button>
  <div class="blitzCol">
   <div class="gameBtns"><span id="heroPowerName" style="color:#ffe14d"></span><span><button class="iconBtn" id="bMute">🔊</button> <button class="iconBtn" id="bPause">❚❚</button></span></div>
   <div class="blitzBar"><i id="blitzFill"></i><span id="blitzTxt">BLITZ</span></div>
  </div>
 </div>
</div>

<div id="levels" class="screen">
 <div class="topbar"><button class="iconBtn" id="lvBack">◀ Back</button><h2>Levels</h2><span></span></div>
 <div class="scroll" style="flex:1;display:flex;justify-content:center"><div class="lvgrid" id="lvGrid"></div></div>
</div>

<div id="collection" class="screen">
 <div class="topbar"><button class="iconBtn" id="colBack">◀ Back</button><h2>Pokédex</h2><span id="colCount"></span></div>
 <div class="scroll" style="flex:1"><div class="grid" id="colGrid"></div></div>
</div>

<div class="modal" id="mResult"><div class="card" id="resultCard"></div></div>

<script>
"use strict";
const N=7, TITLE="Pokemoji Blitz 3";
const TYPE_COLORS={normal:"#ffd6a5",fire:"#ff9a76",water:"#7cc8ff",grass:"#9df28a",electric:"#fff07a",ice:"#a8f3ff",fighting:"#ffa0a0",poison:"#d7a3ff",ground:"#f2d08a",flying:"#b9d4ff",psychic:"#ff9ccf",bug:"#d4f07a",rock:"#e0cf9a",ghost:"#b6a6ff",dragon:"#a6b6ff",dark:"#c4b0a0",steel:"#d0dbe6",fairy:"#ffc2ec"};
const $=id=>document.getElementById(id);
let FAST=false;
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?0:ms));
const rnd=n=>Math.floor(Math.random()*n);
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= SAVE / PROGRESSION ================= */
const SAVE_KEY="pokemojiBlitz3_save_v1";
let save;
function newSave(){
  const byGen=g=>ROSTER.map((p,i)=>[p,i]).filter(([p])=>p.gen===g).map(x=>x[1]);
  const starters=[2,3,8,6,7].map(g=>{const a=byGen(g);return a[rnd(a.length)]});
  const rest=shuffleArr(ROSTER.map((_,i)=>i).filter(i=>!starters.includes(i)));
  return {v:1,starters,order:rest,unlocked:0,maxLevel:1,stars:{},best:{},high:0,hero:starters[0],mute:false,level:1};
}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===1&&s.order&&s.order.length===145)return s}catch(e){}return null}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
const unlockedList=()=>save.starters.concat(save.order.slice(0,save.unlocked));
const nextUnlock=()=>save.unlocked<save.order.length?save.order[save.unlocked]:null;
const unlockPos=i=>{const a=save.starters.concat(save.order);return a.indexOf(i)};
function targetFor(l){return Math.round((1800+260*l+2.2*Math.pow(l,1.6))/50)*50}
function timeFor(l){return 60}

/* ================= HERO POWERS ================= */
// 19 power kinds, ordered from simple to powerful. A Pokemon's power is decided by its unlock position,
// so later unlocks get stronger kinds; the magnitude inside each kind bucket makes every Pokemon's power unique.
const KINDS=[
 {k:"rows",n:"Row Sweep",d:m=>`Clears ${1+(m>4?1:0)} random row${m>4?"s":""} plus ${m} bonus tile${m>1?"s":""}.`},
 {k:"random",n:"Scatter Pop",d:m=>`Pops ${8+2*m} random tiles.`},
 {k:"time",n:"Time Tickle",d:m=>`Adds +${3+Math.floor(m/2)} seconds and pops ${m+2} tiles.`},
 {k:"cols",n:"Column Crash",d:m=>`Clears ${1+(m>4?1:0)} random column${m>4?"s":""} plus ${m} bonus tile${m>1?"s":""}.`},
 {k:"cross",n:"Crossfire",d:m=>`Blasts a row+column cross at ${1+Math.floor(m/4)} spot${m>=4?"s":""}.`},
 {k:"blast",n:"Boom Box",d:m=>`Explodes ${1+Math.floor(m/3)} 3×3 area${m>=3?"s":""}.`},
 {k:"diag",n:"Diagonal Dash",d:m=>`Clears both diagonals plus ${m*2} random tiles.`},
 {k:"items",n:"Berry Rain",d:m=>`Drops ${2+Math.floor(m/2)} Poké Ball bonus items onto the board.`},
 {k:"spawnL",n:"Storm Call",d:m=>`Creates ${2+Math.floor(m/2)} Lightning Clouds.`},
 {k:"type",n:"Type Wipe",d:m=>`Clears every tile of ${m>5?"two types":"the least common type"}.`},
 {k:"transform",n:"Hero Morph",d:m=>`Transforms ${6+m} tiles into this Hero (big combos!).`},
 {k:"spawnS",n:"Sun Burst",d:m=>`Creates ${2+Math.floor(m/3)} Sunshines.`},
 {k:"mult",n:"Score Surge",d:m=>`All points ×2 for ${6+m} seconds.`},
 {k:"blitzfill",n:"Blitz Boost",d:m=>`Fills the Blitz meter ${50+6*m}% and pops ${m+4} tiles.`},
 {k:"freeze",n:"Time Freeze",d:m=>`Freezes the clock for ${4+m} seconds.`},
 {k:"border",n:"Ring Out",d:m=>`Clears the outer ring of the board${m>4?" and the center":""}.`},
 {k:"spawnR",n:"Star Maker",d:m=>`Creates ${1+(m>4?1:0)} Rainbow Star${m>4?"s":""} and +${m} seconds.`},
 {k:"mega",n:"Mega Mix",d:m=>`Creates 2 Lightnings, 1 Sunshine, 1 Rainbow Star and +${2+m}s.`},
 {k:"nuke",n:"Board Bash",d:m=>`Clears the ENTIRE board and adds +${2+m} seconds.`}
];
function powerOf(rIdx){
  const p=Math.max(0,unlockPos(rIdx));
  const ki=Math.min(KINDS.length-1,Math.floor(p*KINDS.length/150));
  const start=Math.ceil(ki*150/KINDS.length);
  const m=p-start+1; const K=KINDS[ki];
  const meter=9+Math.round(ki*1.1)+(m%3);
  return {kind:K.k,name:K.n+(m>1?" "+["","","II","III","IV","V","VI","VII","VIII","IX"][m]:""),desc:K.d(m),m,meter,tier:ki};
}

/* ================= PURE BOARD LOGIC ================= */
let uid=0;
const mk=(t,p,dir)=>({id:++uid,t,p:p||null,dir:dir||null});
const P=i=>[(i/N)|0,i%N];
const at=(B,i)=>B[(i/N)|0][i%N];
const rowCells=r=>Array.from({length:N},(_,c)=>r*N+c);
const colCells=c=>Array.from({length:N},(_,r)=>r*N+c);
const allCells=()=>Array.from({length:N*N},(_,i)=>i);
const typeCells=(B,t)=>allCells().filter(i=>{const x=at(B,i);return x&&x.t===t&&x.p!=="R"&&x.p!=="item"});
function commonType(B,exclude){const cnt={};allCells().forEach(i=>{const x=at(B,i);if(x&&x.t>=0&&x.t!==exclude)cnt[x.t]=(cnt[x.t]||0)+1});let best=-1,bc=-1;for(const t in cnt)if(cnt[t]>bc){bc=cnt[t];best=+t}return best}
function rareType(B,exclude){const cnt={};allCells().forEach(i=>{const x=at(B,i);if(x&&x.t>=0&&x.t!==exclude)cnt[x.t]=(cnt[x.t]||0)+1});let best=-1,bc=1e9;for(const t in cnt)if(cnt[t]<bc){bc=cnt[t];best=+t}return best}
const matchable=x=>x&&x.t>=0&&x.p!=="R"&&x.p!=="item";

function findMatches(B,prefs=[]){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const x=B[r][c];if(!matchable(x)){c++;continue}let e=c+1;while(e<N&&matchable(B[r][e])&&B[r][e].t===x.t)e++;if(e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push(r*N+k);runs.push({h:true,t:x.t,cells})}c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const x=B[r][c];if(!matchable(x)){r++;continue}let e=r+1;while(e<N&&matchable(B[e][c])&&B[e][c].t===x.t)e++;if(e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push(k*N+c);runs.push({h:false,t:x.t,cells})}r=e}}
  const clear=new Set();runs.forEach(R=>R.cells.forEach(i=>clear.add(i)));
  const spawns=[],used=new Set(),taken=new Set();
  const hs=runs.filter(r=>r.h),vs=runs.filter(r=>!r.h);
  for(const h of hs)for(const v of vs){
    if(used.has(h)||used.has(v)||h.t!==v.t)continue;
    const inter=h.cells.find(i=>v.cells.includes(i));
    if(inter==null)continue;
    used.add(h);used.add(v);
    const p=(h.cells.length>=5||v.cells.length>=5)?"R":"S";
    spawns.push({pos:inter,p,t:h.t});taken.add(inter);
  }
  for(const R of runs){
    if(used.has(R)||R.cells.length<4)continue;
    let pos=R.cells.find(i=>prefs.includes(i)&&!taken.has(i));
    if(pos==null)pos=R.cells.find((i,k)=>k>=Math.floor(R.cells.length/2)&&!taken.has(i));
    if(pos==null)continue;
    taken.add(pos);
    spawns.push({pos,p:R.cells.length>=5?"R":"L",t:R.t,dir:R.h?"h":"v"});
  }
  return {runs,clear,spawns};
}
// expand a clear set by firing any power-ups inside it (chain reactions)
function expand(B,set){
  const out=new Set(),effects=[],fired=new Set(),q=[];
  for(const i of set){const x=at(B,i);if(x&&x.p!=="item"){out.add(i);q.push(i)}}
  while(q.length){
    const i=q.shift();const x=at(B,i);if(!x||fired.has(i))continue;fired.add(i);
    const [r,c]=P(i);let add=[];
    if(x.p==="L"){add=x.dir==="v"?colCells(c):rowCells(r);effects.push({k:"L",r,c,dir:x.dir||"h"})}
    else if(x.p==="S"){add=rowCells(r).concat(colCells(c));effects.push({k:"S",r,c})}
    else if(x.p==="R"){const t=commonType(B);add=t>=0?typeCells(B,t):[];effects.push({k:"R",r,c,t})}
    for(const j of add){const y=at(B,j);if(!y||y.p==="item"||out.has(j))continue;out.add(j);q.push(j)}
  }
  return {set:out,effects};
}
function applyGravity(B,gen){
  // returns nothing; new cells get .from (start row, negative) for animation
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){const x=B[r][c];if(x){if(w!==r){B[w][c]=x;B[r][c]=null}w--}}
    const missing=w+1;
    for(let r=w;r>=0;r--){const x=gen(r,c);x.from=r-missing;B[r][c]=x}
  }
}
function collectItems(B){const got=[];for(let c=0;c<N;c++){const x=B[N-1][c];if(x&&x.p==="item"){got.push((N-1)*N+c);B[N-1][c]=null}}return got}
function swapCells(B,a,b){const[ar,ac]=P(a),[br,bc]=P(b);const t=B[ar][ac];B[ar][ac]=B[br][bc];B[br][bc]=t}
const adjacent=(a,b)=>{const[ar,ac]=P(a),[br,bc]=P(b);return Math.abs(ar-br)+Math.abs(ac-bc)===1};
function hasMoves(B){
  for(const i of allCells()){const x=at(B,i);if(x&&(x.p==="L"||x.p==="S"||x.p==="R"))return true}
  return !!findMove(B);
}
function findMove(B){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;const a=r*N+c,b=r2*N+c2;
    if(!B[r][c]||!B[r2][c2])continue;
    swapCells(B,a,b);const m=findMatches(B).clear.size;swapCells(B,a,b);if(m)return[a,b];
  }
  return null;
}
function makeBoard(nTypes=5){
  let B;
  do{
    B=Array.from({length:N},()=>Array(N).fill(null));
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      let t,tries=0;
      do{t=rnd(nTypes);tries++}while(tries<50&&((c>=2&&B[r][c-1].t===t&&B[r][c-2].t===t)||(r>=2&&B[r-1][c].t===t&&B[r-2][c].t===t)));
      B[r][c]=mk(t);
    }
  }while(findMatches(B).clear.size||!findMove(B));
  return B;
}
function reshuffle(B){
  const cells=allCells().map(i=>at(B,i)).filter(Boolean);
  for(let k=0;k<200;k++){
    shuffleArr(cells);let n=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)B[r][c]=cells[n++];
    if(!findMatches(B).clear.size&&findMove(B))return true;
  }
  // fallback: regenerate types
  const nb=makeBoard(5);for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(B[r][c]&&B[r][c].p!=="item"&&!B[r][c].p)B[r][c].t=nb[r][c].t;
  return true;
}
// rainbow star combos: returns {set, convert} without mutating except conversion
function rainbowCombo(B,a,b){
  const x=at(B,a),y=at(B,b);
  if(x.p==="R"&&y.p==="R")return{set:new Set(allCells().filter(i=>at(B,i)&&at(B,i).p!=="item")),kind:"RR"};
  const star=x.p==="R"?a:b,other=x.p==="R"?b:a,o=at(B,other);
  if(o.p==="item"){const t=commonType(B);return{set:new Set([star,...typeCells(B,t)]),kind:"RT",t}}
  const t=o.t;
  if(o.p==="L"||o.p==="S"){
    const cells=typeCells(B,t);
    cells.forEach(i=>{const z=at(B,i);z.p=o.p;if(o.p==="L")z.dir=Math.random()<.5?"h":"v"});
    return{set:new Set([star,other,...cells]),kind:"R"+o.p,t,converted:cells};
  }
  return{set:new Set([star,...typeCells(B,t)]),kind:"RT",t};
}
function comboArea(B,a,b){
  const x=at(B,a),y=at(B,b);const[r,c]=P(b);const s=new Set();const ps=[x.p,y.p].sort().join("");
  const addRow=rr=>{if(rr>=0&&rr<N)rowCells(rr).forEach(i=>s.add(i))},addCol=cc=>{if(cc>=0&&cc<N)colCells(cc).forEach(i=>s.add(i))};
  if(ps==="LL"){addRow(r);addCol(c)}
  else if(ps==="LS"){for(let d=-1;d<=1;d++){addRow(r+d);addCol(c+d)}}
  else{for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)s.add(rr*N+cc)}addRow(r);addCol(c)}
  x.p=null;y.p=null; // consumed (their own effect replaced by combo)
  return{set:s,kind:ps};
}

let AC=null;
function tone(f,d=0.08,type="sine",v=0.12,slide=0){
  if(save&&save.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}

function faceHTML(rIdx,extra=""){const p=ROSTER[rIdx];return `<div class="face" style="--c:${TYPE_COLORS[p.type]||"#ffc"}">${extra}<img src="${p.img}" alt="${p.name}" draggable="false"></div>`}
function setFace(el,rIdx){const p=ROSTER[rIdx];el.style.setProperty("--c",TYPE_COLORS[p.type]);el.querySelector("img").src=p.img}
function layout(){
  const hudH=230;const w=Math.min(window.innerWidth-28,window.innerHeight-hudH,560);
  S=Math.floor(w/N);const b=$("board");b.style.width=b.style.height=S*N+"px";document.documentElement.style.setProperty("--s",S+"px");
  for(const [id,el] of tileEls){const pos=el._pos;if(pos!=null){const[r,c]=P(pos);el.style.transform=`translate(${c*S}px,${r*S}px)`}}
}
function tileClass(x){return "tile"+(x.p?" pu-"+x.p:"")}
function tileInner(x){
  if(x.p==="item")return `<div class="face"></div>`;
  if(x.p==="R")return `<div class="face"></div><div class="star">🌟</div>`;
  const ri=G.types[x.t];
  return faceHTML(ri,x.p==="S"?'<div class="rays"></div>':"")+(x.p==="L"?'<div class="badge">⚡</div>':x.p==="S"?'<div class="badge">☀️</div>':"");
}
function render(){
  const board=$("board");const seen=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=G.B[r][c];if(!x)continue;seen.add(x.id);
    let el=tileEls.get(x.id);const sig=x.t+"|"+x.p;
    if(!el){
      el=document.createElement("div");el.className=tileClass(x)+" noanim"+(x.born?" born":"");el.innerHTML=tileInner(x);el._sig=sig;
      const fr=x.from!=null?x.from:r;el.style.transform=`translate(${c*S}px,${fr*S}px)`;board.appendChild(el);tileEls.set(x.id,el);
      void el.offsetWidth;el.classList.remove("noanim");delete x.from;delete x.born;
    }else if(el._sig!==sig){el.className=tileClass(x);el.innerHTML=tileInner(x);el._sig=sig;el.classList.add("born")}
    el._pos=r*N+c;el.style.transform=`translate(${c*S}px,${r*S}px)`;
    el.classList.toggle("sel",G.sel===r*N+c);
  }
  for(const [id,el] of tileEls)if(!seen.has(id)){tileEls.delete(id);el.classList.add("pop");setTimeout(()=>el.remove(),FAST?0:240)}
}
function clearBoardEls(){for(const[,el]of tileEls)el.remove();tileEls.clear();$("board").querySelectorAll(".fx,.part,.spop").forEach(e=>e.remove())}
function fx(cls,style){const d=document.createElement("div");d.className="fx "+cls;Object.assign(d.style,style);$("board").appendChild(d);setTimeout(()=>d.remove(),700)}
function drawEffect(e){
  if(e.k==="L"){if(e.dir==="v")fx("beamV",{left:(e.c+.1)*S+"px"});else fx("beamH",{top:(e.r+.1)*S+"px"})}
  else if(e.k==="S"){fx("beamV sun",{left:(e.c+.1)*S+"px"});fx("beamH sun",{top:(e.r+.1)*S+"px"})}
  else fx("rainbowSweep",{});
}
const PCOL=["#ff4f9a","#ffd23f","#5ef0ff","#8dff8a","#fff","#a35cff"];
function particles(i,n=5){if(FAST)return;const[r,c]=P(i);const b=$("board");for(let k=0;k<n;k++){const d=document.createElement("div");d.className="part";const a=Math.random()*6.28,dist=20+Math.random()*40;d.style.cssText=`left:${(c+.5)*S-5}px;top:${(r+.5)*S-5}px;background:${PCOL[rnd(6)]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)}}
function scorePop(i,v){const[r,c]=P(i);const d=document.createElement("div");d.className="spop";d.textContent="+"+v;d.style.left=(c*S+S*.1)+"px";d.style.top=(r*S+S*.2)+"px";$("board").appendChild(d);setTimeout(()=>d.remove(),800)}
function comboText(t){const e=$("combo");e.textContent=t;e.classList.remove("show");void e.offsetWidth;e.classList.add("show")}
function shake(){const e=$("boardWrap");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
function banner(t){const e=$("banner");e.textContent=t;e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}

/* ================= CORE LOOP ================= */
const now=()=>performance.now();
function scoreMult(){let m=1;if(G.blitzUntil>now())m*=3;if(G.multUntil>now())m*=2;return m}
async function resolve(set,spawns=[],opts={}){
  G.busy=true;let chain=0;let total=0;
  while(true){
    chain++;
    const ex=expand(G.B,set);const cl=ex.set;
    for(const s of spawns)cl.delete(s.pos);
    ex.effects.forEach(drawEffect);
    if(ex.effects.length){sfx.power();if(ex.effects.length>1||cl.size>14)shake()}
    // scoring and meters
    let heroN=0;const per=Math.round(30*(1+0.5*(chain-1))*scoreMult());
    let i0=null;
    for(const i of cl){const x=at(G.B,i);if(!x)continue;if(x.t===0)heroN++;particles(i,cl.size>20?2:4);i0=i0==null?i:i0;}
    const pts=cl.size*per+spawns.length*100*scoreMult();
    if(cl.size){addScore(pts);if(i0!=null)scorePop([...cl][Math.floor(cl.size/2)],pts);sfx.match(chain)}
    total+=cl.size;
    if(!opts.noHero)addHero(heroN);
    addBlitz(cl.size);
    for(const i of cl){const[r,c]=P(i);G.B[r][c]=null}
    for(const s of spawns){G.stats=G.stats||{L:0,S:0,R:0};G.stats[s.p]++;const[r,c]=P(s.pos);const x=mk(s.p==="R"?-1:s.t,s.p,s.dir);x.born=true;G.B[r][c]=x;}
    if(spawns.length)sfx.item();
    render();await sleep(cl.size?190:60);
    applyGravity(G.B,genCell);render();await sleep(250);
    // collect items that reached the bottom
    for(let guard=0;guard<5;guard++){const got=collectItems(G.B);if(!got.length)break;got.forEach(i=>{scorePop(i,500*scoreMult());particles(i,10)});addScore(500*scoreMult()*got.length);sfx.item();render();await sleep(150);applyGravity(G.B,genCell);render();await sleep(220)}
    if(chain===2)comboText("Great!");else if(chain===3)comboText("Awesome!");else if(chain===4)comboText("Amazing!");else if(chain>=5)comboText("Super Blitz!");
    const m=findMatches(G.B);
    if(!m.clear.size)break;
    set=m.clear;spawns=m.spawns;
  }
  if(!hasMoves(G.B)){banner("Shuffle!");reshuffle(G.B);render();await sleep(400)}
  G.busy=false;
  if(G.pendingBlitz){G.pendingBlitz=false;await startBlitz()}
  if(G.timeUp&&!G.busy)endRound();
  return total;
}
function addScore(v){G.score+=Math.round(v);updateHUD()}
function addHero(n){if(!n||G.heroFull)return;G.hero+=n;if(G.hero>=G.heroMax){G.hero=G.heroMax;G.heroFull=true;tone(880,.2,"triangle",.1,1.5)}updateHUD()}
function addBlitz(n){if(G.blitzUntil>now()||!G.running)return;G.blitz+=n/45;if(G.blitz>=1){G.blitz=1;G.pendingBlitz=true}updateHUD()}
async function startBlitz(){
  G.blitzUntil=now()+8000;G.blitz=1;G.time+=5;document.body.classList.add("blitz");banner("BLITZ!");sfx.blitz();
  let t=rnd(4)+1; // a random non-hero type
  const cells=typeCells(G.B,t);
  if(cells.length)await resolve(new Set(cells),[],{noHero:true});
}
async function doSwap(a,b,dirHint){
  if(G.busy||!G.running||G.paused)return false;
  const x=at(G.B,a),y=at(G.B,b);if(!x||!y||!adjacent(a,b))return false;
  G.busy=true;G.sel=null;
  if(x.p==="R"||y.p==="R"){
    swapCells(G.B,a,b);render();await sleep(140);
    const rc=rainbowCombo(G.B,b,a); // after swap, a holds y, b holds x
    sfx.power();fx("rainbowSweep",{});shake();
    if(rc.kind==="RR")comboText("RAINBOW BLAST!");
    if(rc.converted){render();await sleep(450)}
    // the star itself clears without re-firing as a generic star
    [a,b].forEach(i=>{const z=at(G.B,i);if(z&&z.p==="R")z.p="Rx"});
    await resolve(rc.set);return true;
  }
  const pu=z=>z.p==="L"||z.p==="S";
  if(pu(x)&&pu(y)){
    swapCells(G.B,a,b);render();await sleep(140);
    const ca=comboArea(G.B,a,b);const[r,c]=P(b);
    drawEffect({k:"L",r,c,dir:"h"});drawEffect({k:"L",r,c,dir:"v"});if(ca.kind!=="LL"){drawEffect({k:"S",r:Math.max(0,r-1),c:Math.max(0,c-1)});drawEffect({k:"S",r:Math.min(6,r+1),c:Math.min(6,c+1)})}
    shake();comboText(ca.kind==="LL"?"Cross Zap!":ca.kind==="LS"?"Mega Storm!":"Solar Flare!");
    await resolve(ca.set);return true;
  }
  swapCells(G.B,a,b);sfx.swap();render();await sleep(150);
  const m=findMatches(G.B,[a,b]);
  if(m.clear.size){await resolve(m.clear,m.spawns);return true}
  // swiping a power-up activates it even without a match
  const moved=[[b,x],[a,y]].find(([pos,z])=>pu(z));
  if(moved){const[pos,z]=moved;if(z.p==="L")z.dir=dirHint||((P(a)[0]===P(b)[0])?"h":"v");await resolve(new Set([pos]));return true}
  swapCells(G.B,a,b);sfx.bad();render();await sleep(160);G.busy=false;return false;
}
async function tapCell(i){
  if(G.busy||!G.running||G.paused)return;
  const x=at(G.B,i);if(!x)return;
  if(x.p==="L"||x.p==="S"||x.p==="R"){G.sel=null;await resolve(new Set([i]));return}
  if(G.sel!=null&&G.sel!==i&&adjacent(G.sel,i)){const a=G.sel;G.sel=null;await doSwap(a,i);return}
  G.sel=G.sel===i?null:i;render();
}

/* ---------- hero power execution ---------- */
function randCells(n,filter=()=>true){return shuffleArr(allCells().filter(i=>{const x=at(G.B,i);return x&&x.p!=="item"&&filter(x)})).slice(0,n)}
async function activateHero(){
  if(!G.heroFull||G.busy||!G.running||G.paused)return;
  G.heroFull=false;G.hero=0;updateHUD();
  const pw=G.power,m=pw.m;banner(pw.name.toUpperCase()+"!");sfx.power();shake();
  const s=new Set();const add=a=>a.forEach(i=>s.add(i));
  const plain=x=>!x.p;
  switch(pw.kind){
    case "rows":add(rowCells(rnd(N)));if(m>4)add(rowCells(rnd(N)));add(randCells(m));break;
    case "cols":add(colCells(rnd(N)));if(m>4)add(colCells(rnd(N)));add(randCells(m));break;
    case "random":add(randCells(8+2*m));break;
    case "time":G.time+=3+Math.floor(m/2);add(randCells(m+2));banner("+"+(3+Math.floor(m/2))+"s!");break;
    case "cross":for(let k=0;k<1+Math.floor(m/4);k++){const r=rnd(N),c=rnd(N);add(rowCells(r));add(colCells(c));drawEffect({k:"S",r,c})}break;
    case "blast":for(let k=0;k<1+Math.floor(m/3);k++){const r=1+rnd(5),c=1+rnd(5);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)s.add((r+dr)*N+c+dc)}break;
    case "diag":for(let k=0;k<N;k++){s.add(k*N+k);s.add(k*N+(N-1-k))}add(randCells(m*2));break;
    case "items":randCells(2+Math.floor(m/2),plain).forEach(i=>{const[r,c]=P(i);const it=mk(-1,"item");it.born=true;G.B[r][c]=it});render();break;
    case "spawnL":randCells(2+Math.floor(m/2),plain).forEach(i=>{const x=at(G.B,i);x.p="L";x.dir=Math.random()<.5?"h":"v"});render();break;
    case "spawnS":randCells(2+Math.floor(m/3),plain).forEach(i=>{at(G.B,i).p="S"});render();break;
    case "spawnR":G.time+=m;randCells(1+(m>4?1:0),plain).forEach(i=>{const x=at(G.B,i);x.p="R";x.t=-1});render();break;
    case "mega":G.time+=2+m;{const c=randCells(4,plain);c.slice(0,2).forEach(i=>{const x=at(G.B,i);x.p="L";x.dir=Math.random()<.5?"h":"v"});if(c[2]!=null)at(G.B,c[2]).p="S";if(c[3]!=null){const x=at(G.B,c[3]);x.p="R";x.t=-1}}render();break;
    case "type":{const t=rareType(G.B,0);add(typeCells(G.B,t));if(m>5){const t2=rareType(G.B,t===-1?0:t);if(t2>0)add(typeCells(G.B,t2))}fx("rainbowSweep",{});break}
    case "transform":randCells(6+m,x=>plain(x)&&x.t!==0).forEach(i=>{at(G.B,i).t=0});render();break;
    case "mult":G.multUntil=now()+(6+m)*1000;banner("SCORE ×2!");break;
    case "blitzfill":G.blitz=Math.min(1,G.blitz+(50+6*m)/100);if(G.blitz>=1&&G.blitzUntil<now())G.pendingBlitz=true;add(randCells(m+4));updateHUD();break;
    case "freeze":G.freezeUntil=now()+(4+m)*1000;banner("TIME FREEZE!");break;
    case "border":for(let k=0;k<N;k++){s.add(k);s.add(42+k);s.add(k*N);s.add(k*N+6)}if(m>4)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)s.add((3+dr)*N+3+dc);break;
    case "nuke":G.time+=2+m;add(allCells());fx("rainbowSweep",{});comboText("BOARD BASH!");break;
  }
  await sleep(300);
  if(s.size){await resolve(s,[],{noHero:true})}
  else{const mm=findMatches(G.B);if(mm.clear.size)await resolve(mm.clear,mm.spawns,{noHero:true});else{G.busy=false;if(G.pendingBlitz){G.pendingBlitz=false;await startBlitz()}}}
}

/* ---------- round lifecycle ---------- */
let rafId=0,lastT=0;
function startLevel(level,heroIdx){
  const unl=unlockedList();
  heroIdx=unl.includes(heroIdx)?heroIdx:unl[0];
  save.hero=heroIdx;save.level=level;persist();
  const others=shuffleArr(unl.filter(i=>i!==heroIdx)).slice(0,4);
  while(others.length<4)others.push(unl[others.length%unl.length]);
  Object.assign(G,{level,heroIdx,types:[heroIdx,...others],score:0,target:targetFor(level),time:timeFor(level),hero:0,heroFull:false,
    power:powerOf(heroIdx),blitz:0,blitzUntil:0,multUntil:0,freezeUntil:0,busy:false,running:true,paused:false,timeUp:false,ended:false,sel:null,pendingBlitz:false});
  G.heroMax=G.power.meter;
  clearBoardEls();G.B=makeBoard(5);
  show("game");layout();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)G.B[r][c].from=r-N-2;
  render();
  setFace($("heroFace"),heroIdx);$("heroPowerName").textContent=G.power.name;
  const nx=nextUnlock();$("hNext").src=nx!=null?ROSTER[nx].img:ROSTER[heroIdx].img;
  $("hLevel").textContent=level;$("hTarget").textContent=G.target.toLocaleString();
  document.body.classList.remove("blitz");updateHUD();
  lastT=now();cancelAnimationFrame(rafId);rafId=requestAnimationFrame(tick);
  banner("Level "+level+"!");
}
function tick(t){
  if(!G.running)return;
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  if(!G.paused&&!G.timeUp){
    if(!(G.freezeUntil>now()))G.time-=dt;
    if(G.time<=0){G.time=0;G.timeUp=true;banner("Time's Up!");if(!G.busy)setTimeout(endRound,FAST?0:600)}
  }
  if(G.blitzUntil&&G.blitzUntil<now()&&document.body.classList.contains("blitz")){document.body.classList.remove("blitz");G.blitz=0;G.blitzUntil=0}
  updateHUD(true);
  rafId=requestAnimationFrame(tick);
}
let lastHudTime=-1;
function updateHUD(timeOnly){
  if(!G.types)return;
  const tt=Math.ceil(G.time);if(tt!==lastHudTime){$("hTime").textContent=tt;$("hTime").classList.toggle("low",tt<=10);lastHudTime=tt}
  if(timeOnly&&!(G.blitzUntil>now()))return;
  $("hScore").textContent=G.score.toLocaleString();$("hProg").style.width=Math.min(100,G.score/G.target*100)+"%";
  $("heroBtn").style.setProperty("--m",(G.hero/G.heroMax*100)+"%");$("heroBtn").classList.toggle("full",G.heroFull);
  const bl=G.blitzUntil>now()?Math.max(0,(G.blitzUntil-now())/8000):G.blitz;
  $("blitzFill").style.width=(bl*100)+"%";$("blitzTxt").textContent=G.blitzUntil>now()?"BLITZ MODE ×3!":"BLITZ";
}
function starsFor(score,target){return score>=target*2?3:score>=target*1.5?2:score>=target?1:0}
function endRound(){
  if(G.ended||G.busy)return;G.ended=true;G.running=false;cancelAnimationFrame(rafId);document.body.classList.remove("blitz");
  const win=G.score>=G.target;const st=starsFor(G.score,G.target);const lv=G.level;
  let unlocked=null,newHigh=false;
  if(G.score>save.high){save.high=G.score;newHigh=true}
  save.best[lv]=Math.max(save.best[lv]||0,G.score);
  if(win){
    save.stars[lv]=Math.max(save.stars[lv]||0,st);
    if(lv===save.maxLevel){
      if(save.unlocked<save.order.length){unlocked=save.order[save.unlocked];save.unlocked++}
      if(save.maxLevel<150)save.maxLevel++;
    }
  }
  persist();
  win?sfx.win():sfx.lose();
  const c=$("resultCard");
  c.innerHTML=`<h2 style="font-size:34px;margin:4px;color:#ffe14d;text-shadow:0 3px 0 #ff4f9a">${win?(lv===150?"YOU BEAT ALL 150!":"Level "+lv+" Clear!"):"So Close!"}</h2>
   <div class="stars">${[1,2,3].map(k=>`<span class="${k<=st?"":"off"}">⭐</span>`).join("")}</div>
   <div style="font-size:30px;font-weight:900">${G.score.toLocaleString()}</div><div>Target ${G.target.toLocaleString()} ${newHigh?"• <b style='color:#ffe14d'>NEW HIGH SCORE!</b>":""}</div>
   ${unlocked!=null?`<div class="reveal" style="margin:10px 0"><div class="lbl">New Pokémon Unlocked!</div>${faceHTML(unlocked)}<h3 style="margin:6px 0 0;font-size:24px">${ROSTER[unlocked].name}</h3><div style="font-size:13px">Gen ${ROSTER[unlocked].gen} • #${ROSTER[unlocked].id}</div><div style="color:#ffe14d;font-weight:800;font-size:14px">${powerOf(unlocked).name}: ${powerOf(unlocked).desc}</div></div>`:""}
   <div class="row" style="margin-top:8px">${win&&lv<150?`<button class="btn green" id="rNext">Next Level ▶</button>`:""}<button class="btn blue" id="rRetry">Retry</button><button class="btn pink" id="rMenu">Menu</button></div>`;
  $("mResult").classList.add("on");
  const nb=$("rNext");if(nb)nb.onclick=()=>{$("mResult").classList.remove("on");openHeroSelect(lv+1)};
  $("rRetry").onclick=()=>{$("mResult").classList.remove("on");openHeroSelect(lv)};
  $("rMenu").onclick=()=>{$("mResult").classList.remove("on");showMenu()};
  return {win,unlocked};
}

/* ================= INPUT ================= */
(function(){
  const b=$("board");let down=null;
  const cellAt=e=>{const r=b.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/S),rr=Math.floor((e.clientY-r.top)/S);return(c>=0&&c<N&&rr>=0&&rr<N)?rr*N+c:null};
  b.addEventListener("pointerdown",e=>{e.preventDefault();const i=cellAt(e);if(i==null)return;down={i,x:e.clientX,y:e.clientY,done:false};try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener("pointermove",e=>{if(!down||down.done)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))<S*.3)return;down.done=true;
    const[r,c]=P(down.i);let r2=r,c2=c,dir;if(Math.abs(dx)>Math.abs(dy)){c2+=dx>0?1:-1;dir="h"}else{r2+=dy>0?1:-1;dir="v"}
    if(r2<0||r2>=N||c2<0||c2>=N){const x=at(G.B,down.i);if(x&&x.p==="L"&&!G.busy){x.dir=dir;resolve(new Set([down.i]))}return}
    const x=at(G.B,down.i);if(x&&x.p==="L")x.dir=dir;
    doSwap(down.i,r2*N+c2,dir)});
  const up=e=>{if(down&&!down.done)tapCell(down.i);down=null};
  b.addEventListener("pointerup",up);b.addEventListener("pointercancel",()=>down=null);
  document.addEventListener("touchmove",e=>{if(!e.target.closest(".scroll,.modal .card"))e.preventDefault()},{passive:false});
  document.addEventListener("gesturestart",e=>e.preventDefault());
  document.addEventListener("dblclick",e=>e.preventDefault());
})();

/* ================= SCREENS ================= */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function showMenu(){
  G.running=false;cancelAnimationFrame(rafId);document.body.classList.remove("blitz");
  $("mLevel").textContent=save.maxLevel;$("mHigh").textContent=save.high.toLocaleString();
  const nx=nextUnlock();
  if(nx!=null){$("mNextImg").src=ROSTER[nx].img;$("mNextImg").style.display="";$("mNextName").textContent=ROSTER[nx].name}else{$("mNextImg").style.display="none";$("mNextName").textContent="All caught!"}
  $("mCount").textContent=`(${unlockedList().length}/150)`;
  $("menuFaces").innerHTML=unlockedList().slice(0,5).map(i=>`<div style="animation:bob ${1.6+Math.random()}s ease-in-out infinite">${faceHTML(i)}</div>`).join("");
  show("menu");
}
let hsLevel=1,hsHero=null;
function openHeroSelect(level){
  hsLevel=Math.max(1,Math.min(level,save.maxLevel,150));
  const unl=unlockedList();hsHero=unl.includes(save.hero)?save.hero:unl[0];
  $("hsLevel").textContent="Lv "+hsLevel;$("hsTarget").textContent=targetFor(hsLevel).toLocaleString();
  $("heroGrid").innerHTML=unl.map(i=>`<div class="hcard" data-i="${i}"><span class="gen">G${ROSTER[i].gen}</span>${faceHTML(i)}<div>${ROSTER[i].name}</div></div>`).join("");
  $("heroGrid").querySelectorAll(".hcard").forEach(el=>el.onclick=()=>{hsHero=+el.dataset.i;tone(600,.06);updHeroInfo()});
  updHeroInfo();show("heroSel");
}
function updHeroInfo(){
  const p=ROSTER[hsHero],pw=powerOf(hsHero);
  setFace($("hiFace"),hsHero);$("hiName").textContent=p.name+"  #"+p.id;$("hiPower").textContent="★ "+pw.name;$("hiDesc").textContent=pw.desc;
  $("hiMeter").textContent=`Gen ${p.gen} • ${p.type} • Power meter: ${pw.meter} hero tiles`;
  $("heroGrid").querySelectorAll(".hcard").forEach(el=>el.classList.toggle("sel",+el.dataset.i===hsHero));
}
function openLevels(){
  let h="";for(let l=1;l<=150;l++){const lock=l>save.maxLevel;const st=save.stars[l]||0;h+=`<button class="lv ${lock?"lock":""} ${l===save.maxLevel?"cur":""}" data-l="${l}">${lock?"🔒":l}<small>${lock?"":"★".repeat(st)||"·"}</small></button>`}
  $("lvGrid").innerHTML=h;$("lvGrid").querySelectorAll(".lv").forEach(b=>b.onclick=()=>{const l=+b.dataset.l;if(l<=save.maxLevel)openHeroSelect(l)});
  show("levels");const cur=$("lvGrid").querySelector(".cur");if(cur)cur.scrollIntoView({block:"center"});
}
function openCollection(){
  const unl=new Set(unlockedList());
  $("colCount").textContent=unl.size+"/150";
  const all=save.starters.concat(save.order);
  $("colGrid").innerHTML=all.map((i,k)=>unl.has(i)?`<div class="hcard"><span class="gen">G${ROSTER[i].gen}</span>${faceHTML(i)}<div>${ROSTER[i].name}</div></div>`:`<div class="hcard" style="opacity:.6"><div class="face" style="--c:#fff4"><img src="${ROSTER[i].img}" style="filter:brightness(0)"></div><div>${k===save.starters.length+save.unlocked?"NEXT":"???"}</div></div>`).join("");
  show("collection");
}
function info(html){$("infoCard").innerHTML=html+`<div><button class="btn pink" onclick="document.getElementById('mInfo').classList.remove('on')">Close</button></div>`;$("mInfo").classList.add("on")}
$("bPlay").onclick=()=>openHeroSelect(save.maxLevel);
$("bLevels").onclick=openLevels;$("bCollection").onclick=openCollection;
$("hsBack").onclick=showMenu;$("lvBack").onclick=showMenu;$("colBack").onclick=showMenu;
$("bStart").onclick=()=>startLevel(hsLevel,hsHero);
$("heroBtn").onclick=()=>activateHero();
$("bCredits").onclick=()=>info(`<h2 style="color:#ffe14d">${TITLE}</h2><div class="credits">Created by <b>@JeremeGore</b><br><a href="http://digitalexplorationgrowth.com/" target="_blank" rel="noopener">DigitalExplorationGrowth.com</a></div><p style="font-size:12px;opacity:.85">Fan-made tribute game. Pokémon and character artwork © Nintendo / Creatures Inc. / GAME FREAK inc. Gameplay inspired by Disney Emoji Blitz.</p>`);
$("bHow").onclick=()=>info(`<h2 style="color:#ffe14d">How to Play</h2><div style="text-align:left;font-size:14px;line-height:1.5">
• Swipe (or tap two) neighbors to swap. Match 3+ in a row.<br>• <b>4 in a line</b> → ⚡ Lightning Cloud: swipe left/right to clear its row, up/down for its column.<br>• <b>L or T shape</b> → ☀️ Sunshine: clears its row AND column.<br>• <b>5 in a line</b> → 🌟 Rainbow Star: swap with a Pokémon to clear all of that type; with ⚡/☀️ to make many more; two Stars clear the board!<br>• Swap two power-ups together for giant combos. Tap power-ups to fire them.<br>• Match your <b>Hero</b> to fill the Hero meter, then tap your Hero for its special power.<br>• Fill the rainbow <b>Blitz</b> bar for Blitz Mode: +5s, a type wiped and ×3 points!<br>• Poké Balls that reach the bottom = +500.<br>• Beat a level's target to unlock a new Pokémon. 150 levels!</div>`);
$("bSettings").onclick=()=>info(`<h2 style="color:#ffe14d">Settings</h2><button class="btn blue" id="sMute">${save.mute?"🔇 Sound Off":"🔊 Sound On"}</button><br><button class="btn pink" id="sReset">Reset Progress</button>`)||setTimeout(()=>{
  $("sMute").onclick=()=>{save.mute=!save.mute;persist();$("sMute").textContent=save.mute?"🔇 Sound Off":"🔊 Sound On";syncMute()};
  $("sReset").onclick=()=>{if(confirm("Reset ALL progress? A brand new random roster order will be generated.")){save=newSave();persist();$("mInfo").classList.remove("on");showMenu()}}},0);
function syncMute(){$("bMute").textContent=save.mute?"🔇":"🔊"}
$("bMute").onclick=()=>{save.mute=!save.mute;persist();syncMute()};
$("bPause").onclick=()=>{if(!G.running)return;G.paused=true;info(`<h2>Paused</h2><button class="btn green" id="pRes">Resume</button><button class="btn blue" id="pQuit">Quit</button>`);
  const res=()=>{G.paused=false;lastT=now();$("mInfo").classList.remove("on")};
  setTimeout(()=>{$("pRes").onclick=res;$("pQuit").onclick=()=>{$("mInfo").classList.remove("on");G.paused=false;showMenu()}},0)};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G.running&&!G.paused)$("bPause").onclick()});
window.addEventListener("resize",layout);

/* ================= BOOT ================= */
(async function boot(){
  save=loadSave()||newSave();persist();syncMute();
  let n=0;const imgs=ROSTER.map(p=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>{n++;$("loadBar").style.width=(n/ROSTER.length*100)+"%";r()};im.src=p.img}));
  await Promise.all(imgs);await sleep(250);showMenu();
})();

/* ================= DEBUG / TEST HOOKS ================= */
window.PB={ROSTER,G,KINDS,findMatches,expand,applyGravity,collectItems,hasMoves,findMove,makeBoard,reshuffle,rainbowCombo,comboArea,swapCells,mk,
  targetFor,powerOf,unlockedList,nextUnlock,startLevel,endRound,doSwap,tapCell,activateHero,resolve,render,
  get save(){return save},setFast(v){FAST=v},
  // build a board from rows of tokens: "0".."4" type, suffix L(h)/V(lightning vertical)/S, "R" rainbow, "I" item, "." empty
  parse(rows){return rows.map(row=>row.trim().split(/\s+/).map(tok=>{if(tok===".")return null;if(tok==="R")return mk(-1,"R");if(tok==="I")return mk(-1,"item");const t=+tok[0];const s=tok[1];return s==="L"?mk(t,"L","h"):s==="V"?mk(t,"L","v"):s==="S"?mk(t,"S"):mk(t)}))},
  setBoard(rows){G.B=this.parse(rows);clearBoardEls();render()}};
</script>
